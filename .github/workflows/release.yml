name: Release
# Pushing a tag such as v2.0.0 builds, tests and publishes NumDash.nwa.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (created on the selected commit if missing)
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi
      - run: npm ci
      - run: make test
      - run: make build check
      - name: Package
        run: |
          cp build/numdash.nwa NumDash.nwa
          sha256sum NumDash.nwa > NumDash.nwa.sha256
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          notes=docs/RELEASE_NOTES.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" NumDash.nwa NumDash.nwa.sha256 --clobber
          else
            gh release create "$TAG" NumDash.nwa NumDash.nwa.sha256 --target "$GITHUB_SHA" \
              --title "NumDash $TAG" --notes-file "$notes"
          fi
