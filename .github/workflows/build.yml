name: Build
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libsdl2-dev
      - run: npm ci
      - run: make test
      - run: make build check simulator
      - uses: actions/upload-artifact@v4
        with:
          name: NumDash-nwa
          path: build/numdash.nwa
